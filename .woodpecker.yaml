when:
  - event: [push]

steps:
  - name: build
    image: cont-reg.bjodah.se:443/bjodah/triceratops-3:24
    environment:
      - CC=gcc
      - CXX=g++
      - INSTALL_FLAGS_FOR_PIP=  # --user
    commands:
      - bash -c "source /opt-3/cpython-v3.*-apt-deb/bin/activate; SYM_STRICT_TESTING=1 ./scripts/ci.sh sym"
      - ./scripts/prepare_deploy.sh
